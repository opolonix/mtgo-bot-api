syntax = "proto3";

package telefeeds.telegram.v1;

option go_package = "github.com/mtgo-labs/mtgo-bot-api/internal/gatewaypb;gatewaypb";

service TelegramGateway {
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc DownloadBotApiFile(BotApiFileRequest) returns (stream BotApiFileChunk);
}

enum ApiProtocol {
  API_PROTOCOL_RAW_TL = 0;
  API_PROTOCOL_BOT_API = 1;
}

message InvokeRequest {
  int64 session_peer_id = 1;
  bytes body = 2;
  optional int32 dc_id = 3;
  int32 tl_layer = 4;
  ApiProtocol protocol = 5;
}

message InvokeResponse {
  bytes body = 1;
  optional string error = 2;
  optional TelegramRpcError rpc_error = 3;
  ApiProtocol protocol = 4;
}

message TelegramRpcError {
  int32 code = 1;
  string name = 2;
  optional uint32 value = 3;
  optional uint32 caused_by = 4;
}

message BotApiFileChunk {
  oneof payload {
    BotApiFileHeader header = 1;
    bytes data = 2;
  }
}

message BotApiFileHeader {
  int64 session_peer_id = 1;
  string file_name = 2;
  optional string content_type = 3;
  optional uint64 content_length = 4;
}

message BotApiFileRequest {
  int64 session_peer_id = 1;
  oneof source {
    string upload_id = 2;
    string telegram_file_id = 3;
  }
  optional uint64 offset = 4;
}
